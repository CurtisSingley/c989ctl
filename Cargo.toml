[package]
name = "c989ctl"
version = "0.1.0"
edition = "2024"
description = "Native Linux CLI and iced GUI for the Cloud Nine C989 ErgoFSK keyboard (Firmware 1.82.0.0; built and tested on Arch Linux / i3 / X11)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/curtissingley/c989ctl"
keywords = ["keyboard", "hid", "linux", "c989", "ergofs"]
categories = ["hardware-support", "command-line-utilities", "gui"]

[features]
default = ["gui"]
gui = ["dep:iced"]

[[bin]]
name = "c989ctl"
path = "src/main.rs"

[[bin]]
name = "c989ctl-gui"
path = "src/bin/c989ctl-gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
iced = { version = "0.13", optional = true, features = ["canvas", "tokio", "tiny-skia"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
