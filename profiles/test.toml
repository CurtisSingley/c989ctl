# Cloud Nine C989 ErgoFSK — Verification Test Profile
# Differs from default.toml:
#   - RGB: static green (#00ff00), brightness 6
#   - Smart Wheel: slot 1 Volume set to cyan (#00ffff)
#   - Base keymap: M6 (slot 17, unassigned in default) remapped to 'a'

name = "test"

[rgb]
mode = "static"
color = "#00ff00"
brightness = 6
speed = 6
full_spectrum = false

[[smart_wheel]]
mode = "volume"
color = "#00ffff"

[[smart_wheel]]
mode = "task_switcher"
color = "#ff2020"

[[smart_wheel]]
mode = "vertical_scroll"
color = "#4c20ff"

[[smart_wheel]]
mode = "brightness"
color = "#20ff20"

[keymap.base]
m1 = "caps"
m2 = "scroll_up"
m3 = "scroll_down"
m4 = "mouse_right"
m6 = "a"
m8 = "mouse_left"
m9 = "mouse_middle"
left_space = "backspace"

[keymap.fn]
f1 = "media_player"
f2 = "play_pause"
f3 = "stop"
f4 = "prev_track"
f5 = "next_track"
w = "mouse_middle"
e = "up"
r = "mouse_right"
t = "scroll_up"
i = "mouse_right"
o = "up"
p = "mouse_left"
lbracket = "scroll_up"
s = "left"
d = "down"
f = "right"
g = "scroll_down"
h = "raw:02000100"
j = "raw:02000100"
k = "left"
l = "down"
semicolon = "right"
quote = "scroll_down"
n = "raw:02000100"
m = "left"
comma = "down"
period = "right"
slash = "mouse_middle"
left_space = "mouse_left"
right_space = "mouse_left"
prtsc = "scrlk"
pause = "insert"
